name: Book Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BOOK_FORMATTER_DIR: .work/book-formatter

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout book
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout pinned book-formatter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: itdojp/book-formatter
          ref: 198935ff8f60653c40e513343dc5f02573d9968e
          path: .work/book-formatter
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node metadata
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Ruby and install locked publication renderer
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate editorial, safety, source, and generation contracts
        run: npm test
