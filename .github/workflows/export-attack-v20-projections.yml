name: Export ATT&CK v20 publication projections

on:
  push:
    branches:
      - sources/attack-v20-migration
    paths:
      - .github/workflows/export-attack-v20-projections.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout book
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout pinned book-formatter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: itdojp/book-formatter
          ref: fba61076a7d8171e8344c5d60119f737447214d1
          path: .work/book-formatter
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Ruby and locked renderer
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Export typed publication fields
        shell: bash
        env:
          BOOK_FORMATTER_DIR: .work/book-formatter
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          mkdir -p .tmp/attack-v20-projections
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from scripts.publication_projection import project_documents

          ROOT = Path.cwd()
          CHAPTERS = {
              "05": (
                  "manuscript/05-attack-behavior.md",
                  "templates/attack-behavior-map.md",
                  "cases/ch05-attack-behavior-example.md",
                  "references/ch05-source-review-2026-10-26.md",
              ),
              "06": (
                  "manuscript/06-observable-systems.md",
                  "templates/signal-flow-diagram.md",
                  "cases/ch06-signal-flow-example.md",
                  "references/ch06-source-review-2026-09-12.md",
              ),
              "16": (
                  "manuscript/16-telemetry-evidence-readiness.md",
                  "templates/telemetry-coverage-map.md",
                  "cases/ch16-telemetry-coverage-example.md",
                  "references/ch16-source-review-2026-09-21.md",
              ),
              "18": (
                  "manuscript/18-threat-hunting.md",
                  "templates/hunt-report.md",
                  "cases/ch18-hunt-plan-example.md",
                  "references/ch18-source-review-2026-09-22.md",
              ),
              "21": (
                  "manuscript/21-purple-team-validation.md",
                  "templates/control-validation-plan.md",
                  "cases/ch21-control-validation-example.md",
                  "references/ch21-source-review-2026-09-25.md",
              ),
              "26": (
                  "manuscript/26-cti-distribution.md",
                  "templates/cti-report.md",
                  "templates/executive-brief.md",
                  "cases/ch26-cti-distribution-example.md",
                  "references/ch26-source-review-2026-09-28.md",
              ),
          }

          def stable(value: object) -> bytes:
              return (
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True)
                  + "\n"
              ).encode("utf-8")

          def identity(field):
              return [
                  field.field_type,
                  field.element_kind,
                  field.attribute,
                  field.metadata_value("level"),
                  field.text,
                  field.location,
              ]

          output = {}
          for chapter, paths in CHAPTERS.items():
              sources = {
                  path: (ROOT / path).read_text(encoding="utf-8") for path in paths
              }
              projection = project_documents(sources)
              documents = {}
              for document in projection.documents:
                  fields = [identity(field) for field in document.fields]
                  documents[document.document_id] = {
                      "fieldCount": len(fields),
                      "fields": fields,
                      "headings": [
                          [field.metadata_value("level"), field.text]
                          for field in document.fields
                          if field.field_type == "reader_visible_text"
                          and field.element_kind == "heading"
                          and isinstance(field.metadata_value("level"), int)
                          and field.metadata_value("level") <= 2
                      ],
                      "projectionSha256": hashlib.sha256(
                          stable(fields)
                      ).hexdigest(),
                      "diagnostics": [
                          {
                              "code": item.code,
                              "location": item.location,
                              "reason": item.reason,
                          }
                          for item in document.diagnostics
                      ],
                  }
              output[chapter] = documents

          target = Path(".tmp/attack-v20-projections/publication-projections.json")
          target.write_bytes(stable(output))
          print(target)
          PY

      - name: Upload projection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attack-v20-publication-projections
          path: .tmp/attack-v20-projections
          if-no-files-found: error
          retention-days: 7
