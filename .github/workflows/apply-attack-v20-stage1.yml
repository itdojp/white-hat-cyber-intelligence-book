name: Apply ATT&CK v20 stage 1

on:
  push:
    branches:
      - sources/attack-v20-migration
    paths:
      - .github/workflows/apply-attack-v20-stage1.yml
      - .github/attack-v20-stage1.patch.gz.b64.*
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify parent and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='0de2e33333b1a6810b60b84a38cc4c01fe11ff47'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "${actual_parent}" != "${expected_parent}" ]]; then
            echo "ERROR: unexpected parent ${actual_parent}; expected ${expected_parent}" >&2
            exit 1
          fi

          cat .github/attack-v20-stage1.patch.gz.b64.* > /tmp/attack-v20-stage1.patch.gz.b64
          base64 --decode /tmp/attack-v20-stage1.patch.gz.b64 > /tmp/attack-v20-stage1.patch.gz
          echo 'ca1dc3a53f0d08f05f5875d370dde092419fa625e0d62a6314d3359757f10dce  /tmp/attack-v20-stage1.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/attack-v20-stage1.patch.gz > /tmp/attack-v20-stage1.patch
          git apply --check /tmp/attack-v20-stage1.patch
          git apply --index /tmp/attack-v20-stage1.patch

          rm -f .github/attack-v20-stage1.patch.gz.b64.*
          rm -f .github/workflows/apply-attack-v20-stage1.yml
          git add --all

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: ATT&CK v20本文・Source確認を正本化'
          git push origin HEAD:sources/attack-v20-migration
