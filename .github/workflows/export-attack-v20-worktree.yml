name: Export ATT&CK v20 migration worktree

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-attack-v20-worktree.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout book
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Export tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/export
          git archive --format=tar.gz --output=.tmp/export/white-hat-book-source.tar.gz HEAD
          sha256sum .tmp/export/white-hat-book-source.tar.gz > .tmp/export/SHA256SUMS

      - name: Upload tracked source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attack-v20-migration-source
          path: .tmp/export
          if-no-files-found: error
          retention-days: 7
