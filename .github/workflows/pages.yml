name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BOOK_FORMATTER_DIR: .work/book-formatter

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout book
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout pinned book-formatter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: itdojp/book-formatter
          ref: 764f644850c21983c96919d0e13706413d59c089
          path: .work/book-formatter
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .work/book-formatter/package-lock.json

      - name: Install repository metadata
        run: npm ci --ignore-scripts

      - name: Install pinned book-formatter dependencies
        run: npm ci --prefix .work/book-formatter --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Ruby and install locked publication renderer
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run repository contract tests
        run: npm test

      - name: Generate deterministic site source
        run: npm run sync:docs

      - name: Build Jekyll site
        run: bundle exec jekyll build --source docs --config docs/_config.yml --destination _site --trace
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: itdojp/white-hat-cyber-intelligence-book

      - name: Smoke check built site
        run: python3 scripts/check_built_site.py --source docs --site _site

      # Repository Pages enablement is an explicit operator action tracked in Issue #9.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
