name: Generate ATT&CK v20 snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-attack-v20-snapshot.yml
  push:
    branches:
      - sources/attack-v20-migration
    paths:
      - .github/workflows/generate-attack-v20-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout book
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Download, verify, and extract the finite v20 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/attack-v20
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          COMMIT = "50be388e93819a5d20e71cbaaeccfda157abc846"
          BUNDLE_URL = (
              "https://raw.githubusercontent.com/mitre/cti/"
              f"{COMMIT}/enterprise-attack/enterprise-attack.json"
          )
          BUNDLE_SHA256 = (
              "66f3fe3f07ef1a2de0bd2fe4b3e8a9ea06c1d0bb2c46171bdbb57c7f7b666524"
          )
          BUNDLE_SIZE = 49_253_343
          OBJECT_IDS = (
              "AN1487",
              "AN1488",
              "DC0038",
              "DC0066",
              "DC0069",
              "DET0539",
              "T1671",
              "TA0003",
          )
          OUTPUT = Path(".tmp/attack-v20/ch05-v20.0.json")

          def stable_json(data: object) -> bytes:
              return (
                  json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
              ).encode("utf-8")

          request = urllib.request.Request(
              BUNDLE_URL,
              headers={"User-Agent": "itdojp-white-hat-cyber-intelligence-book/1.0"},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              raw = response.read(BUNDLE_SIZE + 1)
          if len(raw) != BUNDLE_SIZE:
              raise SystemExit(
                  f"ERROR: ATT&CK v20 bundle size mismatch: {len(raw)} != {BUNDLE_SIZE}"
              )
          actual_bundle_sha = hashlib.sha256(raw).hexdigest()
          if actual_bundle_sha != BUNDLE_SHA256:
              raise SystemExit(
                  "ERROR: ATT&CK v20 bundle SHA-256 mismatch: "
                  f"{actual_bundle_sha} != {BUNDLE_SHA256}"
              )

          bundle = json.loads(raw)
          selected: dict[str, tuple[dict, dict]] = {}
          for item in bundle["objects"]:
              for ref in item.get("external_references", []):
                  external_id = ref.get("external_id")
                  if (
                      ref.get("source_name") == "mitre-attack"
                      and external_id in OBJECT_IDS
                  ):
                      if external_id in selected:
                          raise SystemExit(
                              f"ERROR: duplicate ATT&CK external ID: {external_id}"
                          )
                      selected[external_id] = (item, ref)
          if set(selected) != set(OBJECT_IDS):
              missing = sorted(set(OBJECT_IDS) - set(selected))
              raise SystemExit(f"ERROR: missing Chapter 5 ATT&CK objects: {missing}")

          by_stix_id = {
              item["id"]: external_id
              for external_id, (item, _) in selected.items()
          }
          objects = []
          for external_id in OBJECT_IDS:
              item, ref = selected[external_id]
              obj = {
                  "externalId": external_id,
                  "stixId": item["id"],
                  "type": item["type"],
                  "name": item["name"],
                  "version": item["x_mitre_version"],
                  "modified": item["modified"],
                  "deprecated": item.get("x_mitre_deprecated", False),
                  "revoked": item.get("revoked", False),
                  "revokedPropertyPresent": "revoked" in item,
                  "domains": sorted(item["x_mitre_domains"]),
                  "url": ref["url"],
                  "objectSha256": hashlib.sha256(stable_json(item)).hexdigest(),
              }
              if "x_mitre_platforms" in item:
                  obj["platforms"] = sorted(item["x_mitre_platforms"])
              if external_id == "T1671":
                  obj["isSubtechnique"] = item["x_mitre_is_subtechnique"]
                  obj["tactics"] = sorted(
                      phase["phase_name"] for phase in item["kill_chain_phases"]
                  )
              elif external_id == "TA0003":
                  obj["shortname"] = item["x_mitre_shortname"]
              elif external_id == "DET0539":
                  obj["analyticIds"] = sorted(
                      by_stix_id[ref_id]
                      for ref_id in item["x_mitre_analytic_refs"]
                  )
              elif external_id.startswith("AN"):
                  obj["dataComponentIds"] = sorted(
                      {
                          by_stix_id[entry["x_mitre_data_component_ref"]]
                          for entry in item["x_mitre_log_source_references"]
                      }
                  )
                  obj["mutableFields"] = sorted(
                      entry["field"] for entry in item["x_mitre_mutable_elements"]
                  )
              objects.append(obj)

          relationships = []
          for item in bundle["objects"]:
              if item["type"] != "relationship":
                  continue
              if (
                  item.get("source_ref") not in by_stix_id
                  or item.get("target_ref") not in by_stix_id
              ):
                  continue
              relationships.append(
                  {
                      "stixId": item["id"],
                      "type": item["relationship_type"],
                      "source": by_stix_id[item["source_ref"]],
                      "target": by_stix_id[item["target_ref"]],
                      "modified": item["modified"],
                      "revoked": item.get("revoked", False),
                      "deprecated": item.get("x_mitre_deprecated", False),
                      "objectSha256": hashlib.sha256(
                          stable_json(item)
                      ).hexdigest(),
                  }
              )

          snapshot = {
              "schemaVersion": "1.0.0",
              "catalogVersion": "20.0",
              "domain": "enterprise-attack",
              "checkedAt": "2026-10-26",
              "updateStartDate": "2026-10-13",
              "releasePublishedAt": "2026-10-13T18:56:14Z",
              "upstreamCommit": COMMIT,
              "bundleSha256": BUNDLE_SHA256,
              "bundleUrl": BUNDLE_URL,
              "licenseUrl": f"https://github.com/mitre/cti/blob/{COMMIT}/LICENSE.txt",
              "notice": (
                  "Copyright 2026 The MITRE Corporation. See "
                  "THIRD_PARTY_NOTICES.md. Metadata subset; not a complete STIX bundle."
              ),
              "objectHashEncoding": (
                  "UTF-8 JSON, ensure_ascii=False, indent=2, sort_keys=True, trailing LF"
              ),
              "objects": objects,
              "relationships": sorted(relationships, key=lambda row: row["stixId"]),
          }
          result = stable_json(snapshot)
          OUTPUT.write_bytes(result)
          result_sha = hashlib.sha256(result).hexdigest()
          summary = {
              "bundleBytes": len(raw),
              "bundleSha256": actual_bundle_sha,
              "catalogVersion": snapshot["catalogVersion"],
              "objectCount": len(objects),
              "relationshipCount": len(relationships),
              "snapshotSha256": result_sha,
              "versions": {
                  item["externalId"]: {
                      "version": item["version"],
                      "modified": item["modified"],
                      "objectSha256": item["objectSha256"],
                  }
                  for item in objects
              },
          }
          Path(".tmp/attack-v20/snapshot-summary.json").write_bytes(
              stable_json(summary)
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload verified v20 snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attack-v20-snapshot
          path: .tmp/attack-v20
          if-no-files-found: error
          retention-days: 7
