name: Refresh ATT&CK v20 publication contracts

on:
  push:
    branches:
      - sources/attack-v20-migration
    paths:
      - .github/workflows/refresh-attack-v20-contracts.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: sources/attack-v20-migration
          fetch-depth: 2
          persist-credentials: true

      - name: Checkout pinned book-formatter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: itdojp/book-formatter
          ref: fba61076a7d8171e8344c5d60119f737447214d1
          path: .work/book-formatter
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Ruby and locked renderer
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Refresh finite publication contracts
        shell: bash
        env:
          BOOK_FORMATTER_DIR: .work/book-formatter
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          mkdir -p .tmp/attack-v20-contract-refresh
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from difflib import SequenceMatcher
          from pathlib import Path

          from scripts.content_safety_policy import scan_action_text, scan_host_policy
          from scripts.publication_projection import (
              is_absolute_destination,
              is_policy_scan_field,
              project_documents,
          )

          ROOT = Path.cwd()
          HEX = re.compile(r"^[0-9a-f]{64}$")
          CHAPTERS = {
              "05": (
                  "manuscript/05-attack-behavior.md",
                  "templates/attack-behavior-map.md",
                  "cases/ch05-attack-behavior-example.md",
                  "references/ch05-source-review-2026-10-26.md",
              ),
              "06": (
                  "manuscript/06-observable-systems.md",
                  "templates/signal-flow-diagram.md",
                  "cases/ch06-signal-flow-example.md",
                  "references/ch06-source-review-2026-09-12.md",
              ),
              "16": (
                  "manuscript/16-telemetry-evidence-readiness.md",
                  "templates/telemetry-coverage-map.md",
                  "cases/ch16-telemetry-coverage-example.md",
                  "references/ch16-source-review-2026-09-21.md",
              ),
              "18": (
                  "manuscript/18-threat-hunting.md",
                  "templates/hunt-report.md",
                  "cases/ch18-hunt-plan-example.md",
                  "references/ch18-source-review-2026-09-22.md",
              ),
              "21": (
                  "manuscript/21-purple-team-validation.md",
                  "templates/control-validation-plan.md",
                  "cases/ch21-control-validation-example.md",
                  "references/ch21-source-review-2026-09-25.md",
              ),
              "26": (
                  "manuscript/26-cti-distribution.md",
                  "templates/cti-report.md",
                  "templates/executive-brief.md",
                  "cases/ch26-cti-distribution-example.md",
                  "references/ch26-source-review-2026-09-28.md",
              ),
          }

          def stable(value: object) -> bytes:
              return (
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True)
                  + "\n"
              ).encode("utf-8")

          def compact_digest(value: object) -> str:
              raw = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def file_sha(path: str) -> str:
              return hashlib.sha256((ROOT / path).read_bytes()).hexdigest()

          def identity6(field) -> list:
              return [
                  field.field_type,
                  field.element_kind,
                  field.attribute,
                  field.metadata_value("level"),
                  field.text,
                  field.location,
              ]

          def identity4(field) -> list:
              return [
                  field.field_type,
                  field.element_kind,
                  field.attribute,
                  field.text,
              ]

          def heading_inventory(document, *, limit_two: bool) -> list:
              return [
                  [field.metadata_value("level"), field.text]
                  for field in document.fields
                  if field.field_type == "reader_visible_text"
                  and field.element_kind == "heading"
                  and type(field.metadata_value("level")) is int
                  and (not limit_two or field.metadata_value("level") <= 2)
              ]

          def relations(document, chapter: str) -> list[dict]:
              levels: dict[int, str] = {}
              previous_global = None
              previous_by_line: dict[int, list] = {}
              output = []
              for field in document.fields:
                  ident = identity4(field)
                  relation = {
                      "field": ident,
                      "headings": [levels[key] for key in sorted(levels)],
                  }
                  if field.field_type == "destination":
                      relation["owner"] = (
                          previous_by_line.get(field.line)
                          if chapter == "05"
                          else previous_global
                      )
                  output.append(relation)
                  if field.field_type in {
                      "reader_visible_text",
                      "reader_visible_attribute",
                  }:
                      previous_global = ident
                      previous_by_line[field.line] = ident
                  level = field.metadata_value("level")
                  if (
                      field.field_type == "reader_visible_text"
                      and field.element_kind == "heading"
                      and type(level) is int
                  ):
                      levels = {
                          key: value for key, value in levels.items() if key < level
                      }
                      levels[level] = field.text
              return output

          def relation_key(value: dict) -> str:
              return json.dumps(value, ensure_ascii=False, sort_keys=True)

          def similarity(old: dict, new: dict) -> float:
              old_field = old["field"]
              new_field = new["field"]
              if old_field[:3] != new_field[:3]:
                  return -1.0
              score = 0.65 * SequenceMatcher(
                  None, old_field[3], new_field[3]
              ).ratio()
              score += 0.25 * SequenceMatcher(
                  None,
                  " / ".join(old.get("headings", [])),
                  " / ".join(new.get("headings", [])),
              ).ratio()
              old_owner = (old.get("owner") or [None, None, None, ""])[-1] or ""
              new_owner = (new.get("owner") or [None, None, None, ""])[-1] or ""
              score += 0.10 * SequenceMatcher(
                  None, str(old_owner), str(new_owner)
              ).ratio()
              return score

          def map_relations(old_items, new_relations, *, wrapped: bool):
              used: set[int] = set()
              mapped = []
              report = []
              for item in old_items:
                  old = item["relation"] if wrapped else item
                  exact = [
                      index
                      for index, candidate in enumerate(new_relations)
                      if index not in used and candidate == old
                  ]
                  if exact:
                      best_index = exact[0]
                      best_score = 1.0
                  else:
                      candidates = [
                          (similarity(old, candidate), index)
                          for index, candidate in enumerate(new_relations)
                          if index not in used
                      ]
                      best_score, best_index = max(candidates, default=(-1.0, -1))
                      if best_index < 0 or best_score < 0.35:
                          raise SystemExit(
                              "ERROR: publication relation cannot be mapped: "
                              + old["field"][3]
                          )
                  used.add(best_index)
                  replacement = new_relations[best_index]
                  mapped.append(
                      {"relation": replacement, "reason": item["reason"]}
                      if wrapped
                      else replacement
                  )
                  report.append(
                      {
                          "score": best_score,
                          "old": old["field"][3],
                          "new": replacement["field"][3],
                      }
                  )
              return mapped, report

          def current_exceptions(document, current_relations, old_spec):
              reasons = {
                  "action": (
                      "Reviewed descriptive, prohibitive, or non-operative text; "
                      "no live operation. Exact relation only."
                  ),
                  "host": (
                      "Reviewed version, hash, source metadata, or synthetic/"
                      "documentation value; not an operational endpoint. "
                      "Exact relation only."
                  ),
                  "destination": (
                      "Verified official Source or DELEGATE publication URL; "
                      "never an exercise target. Exact relation only."
                  ),
              }
              output = {}
              reports = []
              for kind in ("action", "host", "destination"):
                  old_mapped, mapped_report = map_relations(
                      old_spec["exceptions"][kind],
                      current_relations,
                      wrapped=True,
                  ) if old_spec["exceptions"][kind] else ([], [])
                  reports.extend(mapped_report)
                  by_relation = {
                      relation_key(item["relation"]): item for item in old_mapped
                  }
                  for field, relation in zip(
                      document.fields, current_relations, strict=True
                  ):
                      findings = []
                      if is_policy_scan_field(field):
                          if kind == "action":
                              findings = scan_action_text(
                                  field.normalized_text,
                                  location=field.location,
                              )
                          elif kind == "host":
                              findings = scan_host_policy(
                                  field.normalized_text,
                                  location=field.location,
                              )
                      elif (
                          kind == "destination"
                          and field.field_type == "destination"
                          and is_absolute_destination(field.normalized_text)
                      ):
                          findings = scan_host_policy(
                              field.normalized_text,
                              location=field.location,
                          )
                      if findings:
                          key = relation_key(relation)
                          by_relation.setdefault(
                              key,
                              {"relation": relation, "reason": reasons[kind]},
                          )
                  output[kind] = list(by_relation.values())
              return output, reports

          sources = {
              item["id"]: item
              for item in json.loads(
                  (ROOT / "references/sources.json").read_text(encoding="utf-8")
              )["sources"]
          }

          projections = {}
          for chapter, paths in CHAPTERS.items():
              projection = project_documents(
                  {
                      path: (ROOT / path).read_text(encoding="utf-8")
                      for path in paths
                  }
              )
              if projection.diagnostics:
                  raise SystemExit(
                      f"ERROR: Chapter {chapter} projection diagnostics: "
                      f"{projection.diagnostics}"
                  )
              projections[chapter] = {
                  document.document_id: document
                  for document in projection.documents
              }

          mapping_report = []
          for chapter in ("05", "06"):
              contract_path = ROOT / (
                  f"tests/fixtures/chapter{chapter}/publication-contract.json"
              )
              contract = json.loads(contract_path.read_text(encoding="utf-8"))
              if chapter == "05":
                  old_path = "references/ch05-source-review-2026-09-06.md"
                  new_path = "references/ch05-source-review-2026-10-26.md"
                  contract["documents"][new_path] = contract["documents"].pop(
                      old_path
                  )
                  for page in contract.get("pages", []):
                      if page.get("source") == old_path:
                          page["source"] = new_path
              for path, spec in contract["documents"].items():
                  document = projections[chapter][path]
                  current_relations = relations(document, chapter)
                  spec["headings"] = heading_inventory(
                      document, limit_two=True
                  )
                  spec["required"], report = map_relations(
                      spec["required"], current_relations, wrapped=False
                  )
                  mapping_report.extend(
                      {"chapter": chapter, "path": path, "kind": "required", **row}
                      for row in report
                  )
                  spec["exceptions"], report = current_exceptions(
                      document, current_relations, spec
                  )
                  mapping_report.extend(
                      {"chapter": chapter, "path": path, "kind": "exception", **row}
                      for row in report
                  )
              if chapter == "06":
                  old_snapshot = "tests/fixtures/attack/ch05-v19.2.json"
                  new_snapshot = "tests/fixtures/attack/ch05-v20.0.json"
                  if old_snapshot in contract["parentDigests"]:
                      contract["parentDigests"][new_snapshot] = (
                          contract["parentDigests"].pop(old_snapshot)
                      )
              contract_path.write_bytes(stable(contract))

          def refresh_source_identity(contract: dict) -> None:
              if "sourceIdentity" not in contract:
                  return
              for source_id, existing in list(
                  contract["sourceIdentity"].items()
              ):
                  current = sources[source_id]
                  contract["sourceIdentity"][source_id] = {
                      key: current.get(key) for key in existing
                  }

          def refresh_path_hashes(value) -> None:
              if isinstance(value, dict):
                  for key, item in list(value.items()):
                      candidate = ROOT / key if isinstance(key, str) else None
                      if (
                          candidate is not None
                          and isinstance(item, str)
                          and HEX.fullmatch(item)
                          and candidate.is_file()
                      ):
                          value[key] = file_sha(key)
                      else:
                          refresh_path_hashes(item)
              elif isinstance(value, list):
                  for item in value:
                      refresh_path_hashes(item)

          def host_provenance(document) -> list:
              result = []
              for field in document.fields:
                  eligible = is_policy_scan_field(field) or (
                      field.field_type == "destination"
                      and is_absolute_destination(field.normalized_text)
                  )
                  if eligible and scan_host_policy(
                      field.normalized_text,
                      location=field.location,
                  ):
                      result.append(identity6(field))
              return result

          for chapter in ("16", "18", "21", "26"):
              contract_path = ROOT / (
                  f"tests/fixtures/chapter{chapter}/publication-contract.json"
              )
              contract = json.loads(contract_path.read_text(encoding="utf-8"))
              for path, spec in contract["documents"].items():
                  document = projections[chapter][path]
                  fields = [identity6(field) for field in document.fields]
                  if chapter in {"16", "18"}:
                      spec["fields"] = fields
                  else:
                      spec["projectionSha256"] = compact_digest(fields)
                      spec["fieldCount"] = len(fields)
                      spec["headings"] = heading_inventory(
                          document, limit_two=False
                      )
                  spec["hostProvenance"] = host_provenance(document)
              refresh_source_identity(contract)
              refresh_path_hashes(contract)
              contract_path.write_bytes(stable(contract))

          for chapter in ("05", "06"):
              contract_path = ROOT / (
                  f"tests/fixtures/chapter{chapter}/publication-contract.json"
              )
              contract = json.loads(contract_path.read_text(encoding="utf-8"))
              refresh_source_identity(contract)
              refresh_path_hashes(contract)
              contract_path.write_bytes(stable(contract))

          report_path = Path(
              ".tmp/attack-v20-contract-refresh/mapping-report.json"
          )
          report_path.write_bytes(stable(mapping_report))
          low = [row for row in mapping_report if row["score"] < 0.5]
          print(
              json.dumps(
                  {
                      "mapped": len(mapping_report),
                      "below0.5": low,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Validate refreshed chapter contracts
        shell: bash
        env:
          BOOK_FORMATTER_DIR: .work/book-formatter
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          for chapter in 05 06 16 18 21 26; do
            python3 "scripts/check_chapter${chapter}_contract.py" --no-regressions
          done
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          for chapter in ("05", "06", "16", "18", "21", "26"):
              path = Path(f"tests/fixtures/chapter{chapter}/publication-contract.json")
              json.loads(path.read_text(encoding="utf-8"))
          print("refreshed contract JSON: OK")
          PY

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attack-v20-contract-refresh
          path: |
            .tmp/attack-v20-contract-refresh
            tests/fixtures/chapter05/publication-contract.json
            tests/fixtures/chapter06/publication-contract.json
            tests/fixtures/chapter16/publication-contract.json
            tests/fixtures/chapter18/publication-contract.json
            tests/fixtures/chapter21/publication-contract.json
            tests/fixtures/chapter26/publication-contract.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated contract refresh
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tests/fixtures/chapter05/publication-contract.json \
            tests/fixtures/chapter06/publication-contract.json \
            tests/fixtures/chapter16/publication-contract.json \
            tests/fixtures/chapter18/publication-contract.json \
            tests/fixtures/chapter21/publication-contract.json \
            tests/fixtures/chapter26/publication-contract.json
          if git diff --cached --quiet; then
            echo 'No contract changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: ATT&CK v20 publication contractsを同期'
          git push origin HEAD:sources/attack-v20-migration
